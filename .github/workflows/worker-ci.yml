name: Worker CI and deploy

on:
  pull_request:
    paths:
      - "apps/worker/**"
      - "apps/api/**"
      - "packages/db/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "deploy/worker/**"
      - ".github/workflows/worker-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/worker/**"
      - "apps/api/**"
      - "packages/db/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "deploy/worker/**"
      - ".github/workflows/worker-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: worker_test
          POSTGRES_PASSWORD: worker_test
          POSTGRES_DB: worker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worker_test -d worker_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WORKER_TEST_DATABASE_URL: postgresql://worker_test:worker_test@localhost:5432/worker_test
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/worker

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Initialize isolated queue test database
        run: |
          # Only the users foreign-key target is needed by the generated queue migration.
          psql "$WORKER_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE TABLE users (id uuid PRIMARY KEY)'
          psql "$WORKER_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f ../../packages/db/drizzle/0022_giant_sprite.sql
          psql "$WORKER_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f ../../packages/db/drizzle/0023_magical_storm.sql
          # Exercise the dedicated movie source SQL against its generated schema.
          for migration in 0027_movies_catalog 0030_massive_chameleon 0031_right_tyrannus 0032_tired_serpent_society 0033_chunky_baron_strucker 0036_mute_nova; do
            psql "$WORKER_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "../../packages/db/drizzle/$migration.sql"
          done

      - name: Test
        run: cargo test --locked

      - name: Check deployment scripts
        working-directory: .
        env:
          WORKER_DEPLOY_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          bash -n deploy/worker/deploy.sh deploy/worker/receive.sh deploy/worker/ssh-deploy.sh
          shellcheck deploy/worker/deploy.sh deploy/worker/receive.sh deploy/worker/ssh-deploy.sh
          python3 -m unittest discover -s deploy/worker -p 'test_*.py'
          tmp=$(mktemp -d)
          cp deploy/worker/compose.yml "$tmp/"
          : > "$tmp/worker.env"
          WORKER_GENERATION=g00000000000000000000 \
            WORKER_IMAGE="ghcr.io/example/worker@sha256:$(printf 'a%.0s' {1..64})" \
            docker compose --file "$tmp/compose.yml" config --quiet

  image_amd64:
    name: Image (amd64)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
    env:
      WORKER_PLATFORM: linux/amd64
      WORKER_ARCH: amd64
    steps: &worker_image_steps
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Image name
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}-worker" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish worker
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          platforms: ${{ env.WORKER_PLATFORM }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}-${{ env.WORKER_ARCH }}
          build-args: WORKER_GIT_SHA=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: |
            type=gha,scope=worker-${{ env.WORKER_ARCH }}
            type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker-${{ env.WORKER_ARCH }},timeout=3m,ignore-error=true

  image_arm64:
    name: Image (arm64)
    needs: verify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
    env:
      WORKER_PLATFORM: linux/arm64
      WORKER_ARCH: arm64
    steps: *worker_image_steps

  publish_manifest:
    name: Publish multi-platform tag
    needs: [image_amd64, image_arm64]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge architecture digests
        env:
          AMD64_IMAGE: ${{ needs.image_amd64.outputs.image }}
          ARM64_IMAGE: ${{ needs.image_arm64.outputs.image }}
        run: |
          image="${AMD64_IMAGE%@*}"
          docker buildx imagetools create --tag "$image:$GITHUB_SHA" "$AMD64_IMAGE" "$ARM64_IMAGE"
          docker buildx imagetools inspect "$image:$GITHUB_SHA"

  deploy:
    # The VPS is amd64: ARM publication must never delay its deployment.
    needs: image_amd64
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.WORKER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    environment:
      name: api-production
    env:
      WORKER_IMAGE: ${{ needs.image_amd64.outputs.image }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      DEPLOY_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$KNOWN_HOSTS"
          test -n "$SSH_KEY" || test -n "$SSH_PASSWORD"
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$VPS_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if [[ -n "$SSH_KEY" ]]; then
            printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/vefacaglar-worker-ssh-key"
            chmod 600 "$RUNNER_TEMP/vefacaglar-worker-ssh-key"
          else
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends sshpass
          fi
      - name: Prepare configuration from GitHub secrets
        env:
          WORKER_ENV: ${{ secrets.WORKER_ENV }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          TYPESENSE_HOST: ${{ secrets.TYPESENSE_HOST }}
          TYPESENSE_PORT: ${{ secrets.TYPESENSE_PORT }}
          TYPESENSE_PROTOCOL: ${{ secrets.TYPESENSE_PROTOCOL }}
          TYPESENSE_API_KEY: ${{ secrets.TYPESENSE_API_KEY }}
          LOG_TYPESENSE_URL: ${{ secrets.LOG_TYPESENSE_URL }}
          LOG_TYPESENSE_API_KEY: ${{ secrets.LOG_TYPESENSE_API_KEY }}
          LOG_ENVIRONMENT: ${{ secrets.LOG_ENVIRONMENT }}
          WORKER_ID: ${{ vars.WORKER_ID }}
          WORKER_DB_POOL_MAX: ${{ vars.WORKER_DB_POOL_MAX }}
          RUST_LOG: ${{ vars.WORKER_RUST_LOG }}
          WORKER_DOCKER_NETWORK: ${{ vars.WORKER_DOCKER_NETWORK || vars.API_DOCKER_NETWORK || 'databases_default' }}
          REGISTRY_USER: ${{ github.actor }}
        run: python3 deploy/worker/prepare-deploy.py "$RUNNER_TEMP/vefacaglar-worker-bundle"
      - name: Upload configuration and deploy published image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: bash deploy/worker/ssh-deploy.sh

      - name: Remove temporary deployment credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/vefacaglar-worker-ssh-key"
          rm -rf "$RUNNER_TEMP/vefacaglar-worker-bundle"
