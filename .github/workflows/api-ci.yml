name: API CI and deploy

on:
  pull_request:
    paths:
      - "apps/api/**"
      # Golden fixtures asserted by apps/api/src/shared/search/mappers/mappers.parity.spec.ts.
      - "apps/worker/fixtures/**"
      - "packages/db/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/api-ci.yml"
      - ".dockerignore"
      - "deploy/api/**"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      # Golden fixtures asserted by apps/api/src/shared/search/mappers/mappers.parity.spec.ts.
      - "apps/worker/fixtures/**"
      - "packages/db/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/api-ci.yml"
      - ".dockerignore"
      - "deploy/api/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile

      # The API resolves this workspace dependency through its compiled types.
      - name: Compile database package
        run: pnpm --filter @vefacaglar/db exec tsc

      - name: Typecheck API
        run: pnpm --filter api typecheck

      - name: Test API
        run: pnpm --filter api test

      - name: Compile API
        run: pnpm --filter api exec tsc

      - name: Check deployment scripts
        run: |
          bash -n deploy/api/deploy.sh deploy/api/receive.sh deploy/api/ssh-deploy.sh
          shellcheck deploy/api/deploy.sh deploy/api/receive.sh deploy/api/ssh-deploy.sh
          python3 -m unittest discover -s deploy/api -p 'test_*.py'

      - name: Validate generated Caddy route
        run: |
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          import runpy
          proxy = runpy.run_path('deploy/api/configure-caddy.py')
          existing = 'auth.vefacaglar.com {\n    reverse_proxy authserver:5175\n}\n'
          config = proxy['blue_green_config'](existing, {}, 'vefacaglar-api:3001', 'vefacaglar-api-blue-1:3001', 'blue-1')
          (Path(os.environ['RUNNER_TEMP']) / 'api-test-Caddyfile').write_text(config)
          PYCODE
          docker run --rm --mount "type=bind,src=$RUNNER_TEMP/api-test-Caddyfile,dst=/etc/caddy/Caddyfile,readonly" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Image name
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}-api" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.API_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    environment:
      name: api-production
      url: https://api2.vefacaglar.com
    env:
      API_IMAGE: ${{ needs.image.outputs.image }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      DEPLOY_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$KNOWN_HOSTS"
          test -n "$SSH_KEY" || test -n "$SSH_PASSWORD"
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$VPS_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if [[ -n "$SSH_KEY" ]]; then
            printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/vefacaglar-api-ssh-key"
            chmod 600 "$RUNNER_TEMP/vefacaglar-api-ssh-key"
          else
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends sshpass
          fi
      - name: Prepare configuration from GitHub secrets
        env:
          API_ENV: ${{ secrets.API_ENV }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PG_POOL_MAX: ${{ secrets.PG_POOL_MAX }}
          API_URL: ${{ secrets.API_URL }}
          WEB_URL: ${{ secrets.WEB_URL }}
          AUTH_MODE: ${{ secrets.AUTH_MODE }}
          OIDC_ISSUER: ${{ secrets.OIDC_ISSUER }}
          OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}
          TYPESENSE_HOST: ${{ secrets.TYPESENSE_HOST }}
          TYPESENSE_PORT: ${{ secrets.TYPESENSE_PORT }}
          TYPESENSE_PROTOCOL: ${{ secrets.TYPESENSE_PROTOCOL }}
          TYPESENSE_API_KEY: ${{ secrets.TYPESENSE_API_KEY }}
          TYPESENSE_PUBLIC_URL: ${{ secrets.TYPESENSE_PUBLIC_URL }}
          IMAGEKIT_PRIVATE_KEY: ${{ secrets.IMAGEKIT_PRIVATE_KEY }}
          IMAGEKIT_PUBLIC_KEY: ${{ secrets.IMAGEKIT_PUBLIC_KEY }}
          IMAGEKIT_FOLDER: ${{ secrets.IMAGEKIT_FOLDER }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          JOB_STREAM_TOKEN_SECRET: ${{ secrets.JOB_STREAM_TOKEN_SECRET }}
          WEB_ORIGINS: ${{ secrets.WEB_ORIGINS }}
          LOG_TYPESENSE_URL: ${{ secrets.LOG_TYPESENSE_URL }}
          LOG_TYPESENSE_API_KEY: ${{ secrets.LOG_TYPESENSE_API_KEY }}
          LOG_ENVIRONMENT: ${{ secrets.LOG_ENVIRONMENT }}
          API_DOCKER_NETWORK: ${{ vars.API_DOCKER_NETWORK || 'databases_default' }}
          API_BIND_PORT: ${{ vars.API_BIND_PORT || '3001' }}
          API_CADDY_CONTAINER: ${{ vars.API_CADDY_CONTAINER }}
          API_CADDY_CONFIG_PATH: ${{ vars.API_CADDY_CONFIG_PATH }}
          REGISTRY_USER: ${{ github.actor }}
        run: python3 deploy/api/prepare-deploy.py "$RUNNER_TEMP/vefacaglar-api-bundle"
      - name: Upload configuration and deploy published image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: bash deploy/api/ssh-deploy.sh
      - name: Verify VPS and public HTTPS endpoints
        run: |
          curl --connect-to "api2.vefacaglar.com:443:$VPS_HOST:443" --fail --silent --show-error --retry 24 --retry-delay 5 --retry-all-errors --retry-max-time 180 --max-time 10 https://api2.vefacaglar.com/health | jq -e '.status == "ok"' > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --max-time 15 https://api2.vefacaglar.com/health | jq -e '.status == "ok"' > /dev/null

      - name: Remove temporary deployment credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/vefacaglar-api-ssh-key"
          rm -rf "$RUNNER_TEMP/vefacaglar-api-bundle"
