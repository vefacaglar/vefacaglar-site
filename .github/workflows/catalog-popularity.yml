name: Catalog popularity refresh

on:
  schedule:
    # IGDB updates popularity data daily. Start between catalog-import slots.
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    # Enable the schedule only after the database migration and secrets are in
    # place. A manual dispatch remains available for the initial refresh.
    if: github.event_name == 'workflow_dispatch' || vars.CATALOG_POPULARITY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment: api-production
    # GitHub keeps at most one pending run per group; a newer pending run can
    # replace an older one while the importer is still running.
    concurrency:
      group: catalog-import
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.CATALOG_IMPORT_DATABASE_URL || secrets.DATABASE_URL }}
      IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
      IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
      # The runner cannot reach an internal Docker hostname. Reindex via the
      # public endpoint using the existing Typesense write credential.
      TYPESENSE_PUBLIC_URL: ${{ secrets.TYPESENSE_PUBLIC_URL || 'https://typesense.vefacaglar.com' }}
      TYPESENSE_API_KEY: ${{ secrets.TYPESENSE_API_KEY }}
    steps:
      - name: Check required refresh secrets
        shell: bash
        run: |
          missing=0
          for name in DATABASE_URL IGDB_CLIENT_ID IGDB_CLIENT_SECRET TYPESENSE_API_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Set $name in this repository's Actions secrets or the api-production environment."
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Compile database package
        run: pnpm --filter @vefacaglar/db exec tsc

      - name: Refresh popularity scores
        run: pnpm --filter api catalog:popularity
