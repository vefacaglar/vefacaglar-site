name: vefacaglar-web-${WEB_RELEASE:?Set WEB_RELEASE}

services:
  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE to an immutable image digest}
    restart: unless-stopped
    init: true
    env_file:
      - path: ./web.env
        format: raw
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1::3000"
    networks:
      frontend:
        aliases:
          - vefacaglar-web-${WEB_RELEASE:?Set WEB_RELEASE}
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => r.json()).then(b => process.exit(b.status === 'ok' ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  frontend:
    external: true
    name: ${WEB_DOCKER_NETWORK:?Set WEB_DOCKER_NETWORK}
