# Each replica runs one job; the database admits at most two running jobs.
# Every deployment has a separate Compose project and durable admission mode.
services:
  worker:
    image: ${WORKER_IMAGE:?Set WORKER_IMAGE to the published image digest}
    restart: unless-stopped
    deploy:
      replicas: 2
    init: true
    env_file:
      - path: ./worker.env
        format: raw
    environment:
      WORKER_LOG_FORMAT: json
      WORKER_HEALTH_FILE: /tmp/worker-health
      WORKER_CONTROL_FILE: /run/worker-control/mode
      WORKER_CONTROL_STATUS_FILE: /tmp/worker-control-status
      # Override fixed ids from worker.env: replicas need separate leases.
      WORKER_ID: ""
    labels:
      io.vefacaglar.worker.managed: "1"
      io.vefacaglar.worker.generation: ${WORKER_GENERATION:?Set WORKER_GENERATION}
    volumes:
      - ./control:/run/worker-control:ro
    stop_signal: SIGTERM
    stop_grace_period: 120s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    healthcheck:
      test: ["CMD", "/usr/local/bin/worker", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    external: true
    name: ${WORKER_DOCKER_NETWORK:-databases_default}
