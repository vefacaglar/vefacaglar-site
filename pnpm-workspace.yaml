packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  esbuild: false
# Security floors for vulnerable transitive deps (same major only).
overrides:
  '@fastify/busboy@3': ^3.2.2
  axios@1: ^1.20.0
  brace-expansion@5: ^5.0.12
  fast-uri@3: ^3.1.9
  find-my-way@9: ^9.6.1
  follow-redirects@1: ^1.16.2
  form-data@4: ^4.0.6
  nanoid@3: ^3.3.18
  postcss@8: ^8.5.23
  shell-quote@1: ^1.8.5
  source-map-js@1: ^1.2.2
